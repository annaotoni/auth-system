name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API — lint, testes e build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth -d auth_system_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://auth:auth@localhost:5432/auth_system_test?schema=public
      TEST_DATABASE_URL: postgresql://auth:auth@localhost:5432/auth_system_test?schema=public
      JWT_ACCESS_SECRET: ci-secret-de-teste-com-pelo-menos-32-caracteres
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      MAIL_FROM: noreply@auth-system.local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Lint
        working-directory: apps/api
        run: npm run lint -- --max-warnings=0

      - name: Aplicar migrations no banco de teste
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Testes unitários
        working-directory: apps/api
        run: npm test

      - name: Testes e2e (camada HTTP, mockado)
        working-directory: apps/api
        run: npm run test:e2e

      - name: Testes e2e (fluxo crítico, Postgres real)
        working-directory: apps/api
        run: npx jest --config ./test/jest-e2e-real.json --runInBand

      - name: Build
        working-directory: apps/api
        run: npm run build

  web:
    name: Web — lint e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build
